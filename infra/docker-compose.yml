services:
  postgres:
    image: postgres:16
    container_name: policy-analytics-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-imda_policy}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/app/db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-imda_policy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - policy-analytics

  redis:
    image: redis:7-alpine
    container_name: policy-analytics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - policy-analytics

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: policy-analytics-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-imda_policy}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # LLM API Keys (add to .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATA_GOV_SG_API_KEY: ${DATA_GOV_SG_API_KEY}
      # Analytics settings
      ANALYTICS_BYPASS_TIME_FILTER: ${ANALYTICS_BYPASS_TIME_FILTER:-False}
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ../backend/app:/app/app
      - ../.llm:/app/.llm
      - ../backend/demo_agents.py:/app/demo_agents.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - policy-analytics

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: policy-analytics-frontend
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - policy-analytics

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: policy-analytics-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-imda_policy}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATA_GOV_SG_API_KEY: ${DATA_GOV_SG_API_KEY}
      # Analytics settings
      ANALYTICS_BYPASS_TIME_FILTER: ${ANALYTICS_BYPASS_TIME_FILTER:-False}
    volumes:
      - ../backend/app:/app/app
      - ../.llm:/app/.llm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - policy-analytics

volumes:
  postgres_data:
  redis_data:

networks:
  policy-analytics:
    driver: bridge
